<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>ScholarSync — PhD Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Reminder Banner (shown when event is imminent) -->
  <div id="reminderBanner" class="reminder-banner hidden">
    <span class="reminder-icon">🔔</span>
    <div class="reminder-content">
      <strong id="reminderTitle">Upcoming Event</strong>
      <small id="reminderMeta">in 10 minutes</small>
    </div>
    <button id="dismissReminder" class="icon-btn" aria-label="Dismiss">×</button>
  </div>

  <div class="app-shell">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <a href="#" class="brand">
        <span class="brand-mark">S</span>
        <span><b>ScholarSync</b><small>PhD Command Center</small></span>
      </a>
      <nav class="nav">
        <a href="#" class="nav-link active" data-view="dashboard"><span>📊</span> Dashboard</a>
        <a href="#" class="nav-link" data-view="applications"><span>🎓</span> Applications</a>
        <a href="#" class="nav-link" data-view="emails"><span>📧</span> Email Outreach</a>
        <a href="#" class="nav-link" data-view="meetings"><span>🤝</span> Meetings</a>
        <a href="#" class="nav-link" data-view="study"><span>📚</span> Study Plan</a>
        <a href="#" class="nav-link" data-view="goals"><span>🎯</span> Goals</a>
      </nav>
      <div class="sidebar-footer">
        <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>
        <button id="exportBtn" class="icon-btn" title="Export data">💾</button>
        <button id="importBtn" class="icon-btn" title="Import data">📂</button>
        <input id="fileInput" type="file" accept=".json" hidden>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSubtitle">Your PhD journey at a glance</p>
        </div>
        <div class="topbar-actions">
          <div class="today-chip">
            <span id="currentDate">—</span>
          </div>
          <button id="notifPermission" class="btn btn-ghost">🔔 Enable Reminders</button>
        </div>
      </header>

      <div id="viewContainer" class="view-container">
        <!-- Views are rendered here dynamically -->
      </div>
    </main>
  </div>

  <!-- Universal Modal -->
  <dialog id="modal">
    <form id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle">Add Item</h2>
        <button type="button" class="icon-btn" id="closeModal">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" id="modalDelete" class="btn btn-danger hidden">Delete</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
